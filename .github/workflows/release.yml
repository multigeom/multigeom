name: release

# Only commits of main are released. Publish to PyPI when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0), or to TestPyPI by hand
# (Actions > release > Run workflow). Publishing uses PyPI "trusted publishing" (no token): see docs/source/contributing.rst.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                        # the whole history, to check that the commit is on main
      - name: The release comes from main
        run: |
          git fetch origin main
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "tag ${GITHUB_REF_NAME} is not on main: merge to main first"; exit 1; }
          else
            test "${GITHUB_REF_NAME}" = "main" || { echo "run this workflow from the main branch, not ${GITHUB_REF_NAME}"; exit 1; }
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: The tag matches the version of the package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('multigeom/__init__.py').read()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but the package is $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
