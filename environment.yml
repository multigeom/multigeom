
# Setup the conda virtual environment to run on GPU
#
# author: laquitainesteeve@gmail.com
#
# Tested on:
#
#  - conda 25.5.1
#  - driver-supported CUDA 12.8 (nvidia-smi)
#  - NVIDIA GTX 5090 GPU
#
# Move to the root of the repository and install:
#
# ```bash
# mkdir -p env/ # create virtual environment path
# conda env create -f environment.yml --prefix ./env # (1 min)
# conda activate env
# ```

name: env
channels:
    - conda-forge
dependencies:
    - python=3.11                    # matches requirements-lock.txt
    - numpy
    - scipy
    - matplotlib                     # plotting
    - h5py                           # TVSD .mat (v7.3) loading
    - pillow
    - pyyaml
    - tqdm
    - ipykernel                      # tutorials/1_leading_eigenvectors_of_G.ipynb
    - ipywidgets                     # notebook progress bars (tqdm)
    - pytest                         # unit-testing
    - black=24.10.0
    - pylint=3.3.5
    - pip
    - pip:
        - --extra-index-url https://download.pytorch.org/whl/cu128
        - torch==2.7.0               # STABLE cu128 build (Blackwell-capable); within pyproject range
        - torchvision==0.22.0        # must match the torch build above
        - diffusers==0.37.1          # diffusion models
        - huggingface_hub==0.36.0
        - plenoptic==1.3.1
        - modal                  # optional: run stage 4 on Modal GPUs (tutorials/2_subspace_alignment.ipynb)
