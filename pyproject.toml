[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multigeom"
dynamic = ["version"]                                  # from multigeom/__init__.py (__version__)
description = "Multi-scale Fisher information geometry of neural population codes, estimated with conditional diffusion models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
keywords = ["neuroscience", "information geometry", "Fisher information", "diffusion models", "neural coding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
authors = [
  { name = "Simone Azeglio", email = "simone.azeglio@gmail.com" },
  { name = "Steeve Laquitaine" },
  { name = "Ulisse Ferrari" },
  { name = "Matthew Chalk", email = "matthew.chalk@inserm.fr" },
]
# Core: the Fisher information J(x), the G(x) estimator, the encoder contract, the diffusion model and the pipeline.
# Declared ranges.
dependencies = [
  "torch>=2.1,<2.9",
  "torchvision>=0.16,<0.24",       # the canonical image transform of the data loaders
  "diffusers>=0.30,<0.38",
  "huggingface_hub>=0.25,<1.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=9.3",       # the oldest release with wheels for Python 3.11
  "PyYAML>=6.0",
  "tqdm>=4.65",
  "matplotlib>=3.7",               # the figures and the notebooks
]

[project.optional-dependencies]
# For users: `paper` reproduces the paper, `all` is everything (the notebooks and serverless GPUs too).
paper = ["plenoptic>=1.1,<2.0", "h5py>=3.8"]           # the ON-OFF encoder (plenoptic) and fitting encoders to the TVSD recordings (h5py)
all = ["plenoptic>=1.1,<2.0", "h5py>=3.8", "modal", "ipykernel", "ipython", "ipywidgets"]
# For contributors (see the Contributing page of the documentation):
dev = ["pytest>=8.0", "tomli>=2.0; python_version < '3.11'"]
docs = ["sphinx>=7.2", "pydata-sphinx-theme>=0.15", "nbsphinx>=0.9", "sphinx-design>=0.5", "sphinx-copybutton>=0.5", "ipython"]

[project.urls]
Homepage = "https://multigeom.github.io"
Documentation = "https://multigeom.github.io/multigeom/"
Source = "https://github.com/multigeom/multigeom"
Tutorials = "https://github.com/multigeom/multigeom-tutorials"
Paper = "https://arxiv.org/abs/2605.06304"
Issues = "https://github.com/multigeom/multigeom/issues"

[project.scripts]
multigeom = "multigeom.cli:main"

[tool.setuptools.dynamic]
version = { attr = "multigeom.__version__" }

[tool.setuptools.packages.find]
include = ["multigeom*"]

[tool.setuptools.package-data]
multigeom = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                                     # run the tests from a source checkout without installing
addopts = "-ra --strict-markers"
markers = [
  "slow: takes more than a few seconds (deselect with -m 'not slow')",
  "pretrained: downloads pretrained backbone weights (torchvision / plenoptic)",
  "gpu: needs a CUDA device",
]
