# Inception-V3 encoder configuration.
# Frozen torchvision Inception-V3 (ImageNet weights) truncated at
# Conv2d_4a_3x3, followed by a 50-neuron Gaussian spatial-attention readout.

encoder:
  name: inception
  backbone: inception_v3
  layer: Conv2d_4a_3x3       # → output shape (192, 12, 12) for 64x64 input
  n_neurons: 50              # top-50 most-reliable channels in the area
  dropout: 0.25              # applied to feature map during training only

train:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  batch_size: 64
  epochs: 100
  validation_fraction: 0.05  # 95/5 image-level train/val split (paper App. C.2)
  seed: 42
